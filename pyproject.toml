[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atpg-toolkit"
version = "0.1.0"
description = "Stuck-at fault simulation and automatic test pattern generation for combinational circuits"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Urvish Kosta" }]
keywords = ["atpg", "dft", "design-for-test", "fault-simulation", "podem",
            "stuck-at", "iscas85", "vlsi", "sat", "eda"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = ["python-sat>=0.1.8"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
atpg = "atpg.cli:main"

[project.urls]
Homepage = "https://github.com/Urvish-Kosta/atpg-toolkit"
Issues = "https://github.com/Urvish-Kosta/atpg-toolkit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 96
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E731"]
