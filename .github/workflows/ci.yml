name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # python-sat (PySAT) only ships pre-release-tagged builds on PyPI
      # (its own versioning convention, not a project bug) -- --pre is
      # required or pip's resolver refuses to select it as a dependency.
      - run: pip install --pre -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Fetch benchmarks
        run: python scripts/fetch_benchmarks.py
        continue-on-error: true
      - name: Test
        run: pytest -q
